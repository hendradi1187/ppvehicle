<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CPU PoC · PPVehicle</title>
<style>
:root{color-scheme:dark;--bg:#07131d;--panel:#0b1a25;--line:#234052;--text:#f1f6fa;--muted:#8ca3b2;--ok:#3fd08c;--bad:#f87a6e;--warn:#f5c451;font:14px/1.45 system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}header{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:16px 24px;background:#07131dee;border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}h1{font-size:20px;margin:0}a{color:#8bc6ff}.wrap{max-width:1500px;margin:auto;padding:20px}.summary,.cams{display:grid;gap:14px}.summary{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:14px}.cams{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}.kpi{padding:14px 16px}.kpi b{display:block;font-size:23px}.muted{color:var(--muted)}.camhead{display:flex;align-items:flex-start;justify-content:space-between;padding:15px 16px;border-bottom:1px solid var(--line);gap:10px}h2{font-size:18px;margin:0}.badge{font-weight:700;border:1px solid;border-radius:999px;padding:4px 9px}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}button{border:1px solid var(--line);border-radius:7px;background:#132b3a;color:var(--text);padding:6px 9px;cursor:pointer}button:hover{border-color:#168af5}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.body{display:grid;grid-template-columns:minmax(240px,42%) 1fr;gap:16px;padding:16px}.frame{width:100%;aspect-ratio:16/9;object-fit:cover;background:#02080d;border-radius:8px;border:1px solid var(--line)}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.metric{padding:10px;background:#0f2230;border-radius:8px;min-width:0}.metric b{display:block;font-size:18px;overflow-wrap:anywhere}.section{margin-top:14px}.gates{display:flex;flex-wrap:wrap;gap:7px}.gate{padding:5px 8px;border:1px solid var(--line);border-radius:7px}.error{margin-top:10px;padding:9px;border-left:3px solid var(--bad);background:#321b1d;color:#ffc3bd;overflow-wrap:anywhere}.classes{width:100%;border-collapse:collapse}.classes td,.classes th{padding:7px;border-bottom:1px solid var(--line);text-align:left}.gaps{margin:14px 0 0;padding:14px 32px}.foot{padding:14px 0;color:var(--muted)}@media(max-width:1000px){.summary{grid-template-columns:repeat(2,1fr)}.cams{grid-template-columns:1fr}}@media(max-width:620px){header{padding:12px}.wrap{padding:10px}.body{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<header><div><h1>PPVehicle CPU · 2 Kamera</h1><div class="muted" id="stamp">memuat…</div></div><nav><button onclick="startDual('compact')">Start 2 compact</button> <button onclick="startDual('accurate')">Start 2 akurat</button> <button onclick="stopDual()">Stop 2</button> · <a href="/demo">Dashboard utama</a> · <a href="/docs">API</a></nav></header>
<main class="wrap"><section class="summary" id="summary"></section><section class="cams" id="cams"></section><section class="card gaps"><b>Gap yang masih harus ditutup</b><ul id="gaps"></ul></section><div class="foot">Refresh otomatis 3 detik. Halaman ini tidak membuka koneksi baru ke CCTV dan tidak memulai inference.</div></main>
<script>
const esc=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const age=s=>s==null?'—':s<60?`${Math.round(s)} dtk`:s<3600?`${Math.round(s/60)} mnt`:`${(s/3600).toFixed(1)} jam`;
const cls=s=>['HEALTHY','LAST_RUN_OK','LAST_LIVE_OK'].includes(s)?'ok':['DEGRADED','STOPPED','NO_DATA'].includes(s)?'warn':'bad';
function metric(k,v){return `<div class="metric"><span class="muted">${esc(k)}</span><b>${esc(v)}</b></div>`}
function cam(c){const h=c.live?.telemetry||{},cap=h.capture||{},cnt=c.counter||{},t=c.live?.traffic||{};return `<article class="card"><div class="camhead"><div><h2>${esc(c.name)}</h2><div class="muted">${esc(c.key)} · ${esc(c.area)} · ${esc(c.stream_kind)}</div><div class="actions"><button onclick="startLive('${c.key}','compact')">Uji compact</button><button onclick="startLive('${c.key}','accurate')">Uji akurat</button><button onclick="stopLive()">Stop</button></div></div><span class="badge ${cls(c.state)}">${esc(c.state)}</span></div><div class="body"><div><img class="frame" src="${esc(c.frame_url)}?t=${Date.now()}" onerror="this.style.opacity=.25"><div class="section muted">Hasil counter terakhir · ${age(cnt.age_sec)} lalu</div>${c.capture?.error?`<div class="error">${esc(c.capture.error)}</div>`:''}</div><div><div class="metrics">${metric('Kondisi lalin',t.state)}${metric('Quality',t.quality_score==null?'—':(t.quality_score*100).toFixed(0)+'%')}${metric('Occupancy',t.occupancy_ratio==null?'—':(t.occupancy_ratio*100).toFixed(1)+'%')}${metric('Speed relatif',t.median_speed_px_s==null?'—':t.median_speed_px_s+' px/s')}${metric('Stopped',t.stopped_ratio==null?'—':(t.stopped_ratio*100).toFixed(0)+'%')}${metric('Speed samples',t.speed_observations)}${metric('Visible',cnt.visible_now)}${metric('Unique track',cnt.unique_tracks)}${metric('Crossing',cnt.crossing)}${metric('Live model',c.live?.model_mode)}${metric('Sampling',c.live?.sample_interval==null?'—':c.live.sample_interval+' dtk')}${metric('Effective FPS',h.effective_fps)}${metric('Infer p95',h.inference_ms_p95==null?'—':h.inference_ms_p95+' ms')}${metric('Queue p95',h.queue_delay_sec_p95==null?'—':h.queue_delay_sec_p95+' dtk')}${metric('Frame dibuang',cap.dibuang_total??0)}${metric('Reconnect',cap.putus??0)}</div><div class="section muted">Traffic rule: ${esc(t.status)} · ${esc(t.reason)}</div><div class="section"><b>Quality gates</b><div class="gates">${Object.entries(c.gates||{}).map(([k,v])=>`<span class="gate ${v?'ok':'bad'}">${v?'✓':'×'} ${esc(k)}</span>`).join('')}</div></div><div class="section"><table class="classes"><thead><tr><th>Kelas</th><th>Tampak</th><th>Lintas</th></tr></thead><tbody>${(cnt.per_class||[]).map(x=>`<tr><td>${esc(x.nama)}</td><td>${esc(x.per_frame)}</td><td>${esc(x.masuk)}</td></tr>`).join('')||'<tr><td colspan="3" class="muted">Belum ada hasil</td></tr>'}</tbody></table></div></div></div></article>`}
async function startLive(key,model){document.querySelector('#stamp').textContent=`Memulai ${key} (${model})…`;await fetch(`/api/langsung/mulai?key=${encodeURIComponent(key)}&model=${model}`,{method:'POST'});refresh()}
async function stopLive(){await fetch('/api/langsung/henti',{method:'POST'});refresh()}
async function startDual(model){document.querySelector('#stamp').textContent=`Memulai dua kamera (${model})…`;await fetch(`/api/cpu-poc/start?model=${model}`,{method:'POST'});refresh()}
async function stopDual(){await fetch('/api/cpu-poc/stop',{method:'POST'});refresh()}
async function refresh(){try{const r=await fetch('/api/cpu-poc',{cache:'no-store'});if(!r.ok)throw Error(await r.text());const d=await r.json();document.querySelector('#stamp').textContent=d.at;const mem=d.runtime.memory;document.querySelector('#summary').innerHTML=[['Profile',d.profile],['CPU',d.runtime.cpu_count+' logical'],['Load 1m',d.runtime.load_1m],['Memory',`${mem.used_mb??'—'} / ${mem.limit_mb??'—'} MB`]].map(x=>`<div class="card kpi"><span class="muted">${x[0]}</span><b>${x[1]}</b></div>`).join('');document.querySelector('#cams').innerHTML=d.cameras.map(cam).join('');document.querySelector('#gaps').innerHTML=d.known_gaps.map(x=>`<li>${esc(x)}</li>`).join('')}catch(e){document.querySelector('#stamp').textContent='Gagal: '+e.message}}
refresh();setInterval(refresh,3000);
</script></body></html>
